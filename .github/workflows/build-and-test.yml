name: Build, Test and Release FileBot

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ant openjfx libopenjfx-java libmediainfo0v5 libchromaprint-tools libzen0v5

      - name: Download JAR and Native Dependencies
        run: |
          chmod +x ./download_deps.sh
          ./download_deps.sh

      - name: Compile FileBot
        run: ant jar

      - name: Setup environment for testing
        run: |
          echo "API_KEY_THEMOVIEDB=${{ secrets.API_KEY_THEMOVIEDB }}" > .env
          echo "API_KEY_THETVDB=${{ secrets.API_KEY_THETVDB }}" >> .env
          echo "API_KEY_FANART_TV=${{ secrets.API_KEY_FANART_TV }}" >> .env
          echo "API_KEY_OMDB=${{ secrets.API_KEY_OMDB }}" >> .env

      - name: Build Docker Container
        run: docker build -t filebot .

      - name: Run E2E Test
        run: |
          chmod +x ./test_e2e.sh
          ./test_e2e.sh

  release:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/filebot:latest
